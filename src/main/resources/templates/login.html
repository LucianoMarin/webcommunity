<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Gamer Community</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">

<div class="auth-box">
    <h2>Iniciar Sesión</h2>

    <p class="msg error" th:if="${param.error}">Credenciales incorrectas.</p>
    <p class="msg ok" th:if="${param.logout}">Has cerrado sesión.</p>
    <p class="msg ok" th:if="${param.registrado}">Registro exitoso. Inicia sesión.</p>

    <form th:action="@{/login}" method="post">
        <label>Usuario</label>
        <input type="text" name="username" required>

        <label>Contraseña</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    <p class="link"><a th:href="@{/home}">Volver al inicio</a></p>
</div>

</body>
</html>
