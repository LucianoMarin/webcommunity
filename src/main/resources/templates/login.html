<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login - Gamer Community</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">

<div class="auth-box">
    <h2>Iniciar Sesión</h2>

    <p class="msg error" th:if="${param.error}">Credenciales incorrectas.</p>
    <p class="msg ok" th:if="${param.logout}">Has cerrado sesión.</p>
    <p class="msg ok" th:if="${param.registrado}">Registro exitoso. Inicia sesión.</p>

    <form novalidate th:action="@{/login}" method="post">
        <label for="username">Usuario</label>
<input id="username" type="text" name="username" autocomplete="username" required>

        <label for="password">Contraseña</label>
<input id="password" type="password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn-primary">Entrar</button>
    </form>

    <p class="link">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
    <p class="link"><a th:href="@{/home}">Volver al inicio</a></p>
</div>

<script defer th:src="@{/js/forms.js}"></script>
</body>
</html>
