<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Registro - Gamer Community</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body class="auth-page">

<div class="auth-box">
    <h2>Crear cuenta</h2>

    <p class="msg error" th:if="${error}" th:text="${error}"></p>

    <form novalidate th:action="@{/registro}" method="post" th:object="${usuario}">
    <div class="msg error" role="alert" th:if="${#fields.hasAnyErrors()}"><p>Revisa los datos del formulario:</p><ul><li th:each="err : ${#fields.allErrors()}" th:text="${err}"></li></ul></div>
        <label for="username">Nombre de usuario</label>
<input id="username" type="text" th:field="*{username}" required>

        <label for="email">Correo electrónico</label>
<input id="email" type="email" th:field="*{email}" required>

        <label for="password">Contraseña</label>
<input id="password" type="password" name="password" autocomplete="new-password" aria-describedby="password-help" required>
        <p id="password-help">Usa al menos 12 caracteres y un máximo de 72 bytes. Puedes usar una frase larga.</p>

        <button type="submit" class="btn-primary">Registrarme</button>
    </form>

    <p class="link">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
</div>

<script defer th:src="@{/js/forms.js}"></script>
</body>
</html>
