<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Mi Perfil - Gamer Community</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="navbar">
    <div class="logo">Gamer Community</div>
    <nav>
        <a th:href="@{/home}">Inicio</a>
        <a th:href="@{/eventos}">Eventos</a>
        <a th:href="@{/perfil}">Mi Perfil</a>
<form novalidate th:action="@{/logout}" method="post" class="layout-6b8b63d565">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </nav>
</header>

<main class="perfil-main">
    <h1>Mi Perfil</h1>

    <p class="msg ok" th:if="${param.actualizado}">Perfil actualizado correctamente.</p>

    <div class="perfil-card">
        <div class="avatar-preview">
            <img th:src="@{/images/avatar.svg}" alt="Avatar" width="120" height="120">
        </div>

<form novalidate th:action="@{/perfil}" method="post" th:object="${datos}">
        <p class="msg error" role="alert" th:if="${#fields.hasAnyErrors()}">Revisa el avatar y el largo de los juegos de interés (máximo 1000 caracteres).</p>
            <label>Usuario</label>
            <input type="text" th:value="${usuario.username}" disabled>

            <label>Correo</label>
            <input type="email" th:value="${usuario.email}" disabled>

            <label for="avatarUrl">Avatar</label>
<select id="avatarUrl" th:field="*{avatarUrl}"><option value="/images/avatar.svg">Control gamer</option></select>

            <label for="juegosInteres">Juegos de interés</label>
<input id="juegosInteres" type="text" th:field="*{juegosInteres}" placeholder="Valorant, LoL, CS2...">

            <label>
                <input type="checkbox" th:field="*{notificarEmail}">
                Recibir notificaciones por email
            </label>

            <label>
                <input type="checkbox" th:field="*{notificarPush}">
                Recibir notificaciones push
            </label>

            <button type="submit" class="btn-primary">Guardar cambios</button>
        </form>
    </div>
</main>

<script defer th:src="@{/js/forms.js}"></script>
</body>
</html>
