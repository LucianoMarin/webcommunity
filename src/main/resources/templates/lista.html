<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Eventos - Gamer Community</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="navbar">
    <div class="logo">Gamer Community</div>
    <nav>
        <a th:href="@{/home}">Inicio</a>
        <a th:href="@{/eventos}">Eventos</a>
        <a th:href="@{/perfil}">Mi Perfil</a>
        <form novalidate th:action="@{/logout}" method="post" class="layout-6b8b63d565">
            <button type="submit" class="btn-logout">Cerrar sesión</button>
        </form>
    </nav>
</header>

<main>
    <h1>Buscar eventos</h1>

    <form novalidate th:action="@{/eventos}" method="get" class="filtros">
        <input type="text" aria-label="Categoría" name="categoria" placeholder="Categoría (Esports, Expo...)"
               th:value="${categoria}">

        <input type="datetime-local" aria-label="Fecha y hora" name="fecha" th:value="${fecha}">

        <input type="text" aria-label="Ubicación" name="ubicacion" placeholder="Ubicación"
               th:value="${ubicacion}">

        <button type="submit" class="btn-primary">Buscar</button><a th:href="@{/eventos}" class="btn-secondary">Limpiar filtros</a>
    </form>

    <div class="eventos-grid" th:if="${not #lists.isEmpty(eventos)}">
        <div class="card" th:each="e : ${eventos}">
            <h3 th:text="${e.nombre}">Evento</h3>
            <p><strong>Categoría:</strong> <span th:text="${e.categoria}"></span></p>
            <p><strong>Fecha:</strong>
                <span th:text="${#temporals.format(e.fechaHora, 'dd/MM/yyyy HH:mm')}"></span>
            </p>
            <p><strong>Dirección:</strong> <span th:text="${e.direccion}"></span></p>
            <a th:href="@{/eventos/{id}(id=${e.id})}" class="btn-secondary">Ver detalle</a>
        </div>
    </div>

    <p th:if="${#lists.isEmpty(eventos)}" class="msg">No se encontraron eventos con esos filtros.</p>
</main>

<script defer th:src="@{/js/forms.js}"></script>
</body>
</html>
