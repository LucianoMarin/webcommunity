<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Formulario Evento - Gamer Community</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<header class="navbar">
    <div class="logo">Gamer Community - Admin</div>
    <nav>
        <a th:href="@{/admin}">Volver al Panel</a>
    </nav>
</header>

<main class="layout-b7dd1a6a52">
    <h1 th:text="${evento.id != null ? 'Editar Evento' : 'Crear Nuevo Evento'}">Evento</h1>

    <form novalidate th:action="@{/admin/evento/guardar}" method="post" th:object="${evento}" class="layout-8b95e9864f">
        <p class="msg error" role="alert" th:if="${#fields.hasAnyErrors()}">Revisa los datos: nombre obligatorio (máximo 200 caracteres), fecha obligatoria y descripción de hasta 5000 caracteres.</p><input type="hidden" th:field="*{id}">
        
        <label for="nombre">Nombre del Evento</label>
<input id="nombre" type="text" th:field="*{nombre}" required class="layout-a38d25194a">

        <label for="descripcion">Descripción</label>
<textarea id="descripcion" th:field="*{descripcion}" rows="4" class="resize-none layout-a38d25194a"></textarea>

        <label for="direccion">Dirección</label>
<input id="direccion" type="text" th:field="*{direccion}" class="layout-a38d25194a">

        <label for="fechaHora">Fecha y Hora</label>
<input id="fechaHora" type="datetime-local" th:field="*{fechaHora}" class="layout-a38d25194a">

        <label for="organizadores">Organizadores</label>
<input id="organizadores" type="text" th:field="*{organizadores}" class="layout-a38d25194a">

        <label for="expositoresPrincipales">Expositores Principales</label>
<input id="expositoresPrincipales" type="text" th:field="*{expositoresPrincipales}" class="layout-a38d25194a">

        <label for="categoria">Categoría</label>
<input id="categoria" type="text" th:field="*{categoria}" placeholder="Ej: Esports, Expo, Comunidad" class="layout-a38d25194a">

        <div class="layout-ab2d60718d">
            <label><input type="checkbox" th:field="*{tieneEstacionamiento}"> Estacionamiento</label>
            <label><input type="checkbox" th:field="*{tieneLocomocion}"> Locomoción</label>
            <label><input type="checkbox" th:field="*{tieneComidas}"> Comidas</label>
            <label><input type="checkbox" th:field="*{tieneAlojamiento}"> Alojamiento</label>
        </div>

        <button type="submit" class="layout-9a7472a9ec btn-primary">Guardar Evento</button>
    </form>
</main>

<script defer th:src="@{/js/forms.js}"></script>
</body>
</html>
